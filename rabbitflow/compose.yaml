services:
  rabbitmq:
    image: docker.io/library/rabbitmq:4.1-management-alpine
    hostname: rabbitflow-broker
    # Start the image entrypoint as container root so it can repair named-volume
    # ownership under rootless Podman. The entrypoint drops to the rabbitmq user.
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
      - chown rabbitmq:rabbitmq /var/lib/rabbitmq/.erlang.cookie 2>/dev/null || true; exec docker-entrypoint.sh rabbitmq-server
    environment:
      RABBITMQ_DEFAULT_USER: demo
      RABBITMQ_DEFAULT_PASS: demo
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitflow-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    build: .
    environment:
      AMQP_URL: amqp://demo:demo@rabbitmq:5672/
      HTTP_ADDR: 0.0.0.0:8080
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
    stop_grace_period: 20s
volumes:
  rabbitflow-data:
